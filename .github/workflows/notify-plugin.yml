name: Notify googlefonts/fontc-export-plugin of fontc release

# Trigger when the release.yml workflow completes successfully.
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_run
#
# workflow_run is safe here: this workflow checks out nothing, reuses no
# artifacts from the triggering run, passes its inputs through env vars,
# and only fires off Release, which itself only runs on pushed tags.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify-plugin:
    runs-on: ubuntu-latest
    environment: fontc-plugin-notifications
    # Only run if Release succeeded AND was triggered by a fontc tag.
    # The `head_branch` property contains the tag name in case of a tag-triggered workflow.
    # https://docs.github.com/en/webhooks/webhook-events-and-payloads#workflow_run
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'fontc-v')

    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME="${GITHUB_EVENT_WORKFLOW_RUN_HEAD_BRANCH}"
          # Remove 'fontc-v' prefix to get just the version number
          VERSION="${TAG_NAME#fontc-v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION from tag: $TAG_NAME"
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}

      # Only notify the plugin of full releases; pre-releases (e.g. 1.0.0-rc.1)
      # skip the dispatch instead of failing the run.
      - name: Check version format (X.Y.Z)
        id: check
        run: |
          VERSION="${STEPS_VERSION_OUTPUTS_VERSION}"
          TAG_NAME="${GITHUB_EVENT_WORKFLOW_RUN_HEAD_BRANCH}"
          if [ "$VERSION" = "$TAG_NAME" ]; then
            echo "ERROR: Failed to extract version from tag: $TAG_NAME"
            echo "Expected tag format: fontc-vX.Y.Z"
            exit 1
          fi
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Version validated: $VERSION"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Pre-release version: $VERSION; skipping plugin notification"
          fi
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}

      # https://docs.github.com/en/rest/repos/repos?apiVersion=2022-11-28#create-a-repository-dispatch-event
      - name: Send repository_dispatch to plugin repo
        if: steps.check.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.FONTC_GLYPHS_PLUGIN_REPO_TOKEN }}
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api repos/googlefonts/fontc-export-plugin/dispatches \
            --method POST \
            --raw-field event_type='fontc-release' \
            --raw-field "client_payload[version]=${STEPS_VERSION_OUTPUTS_VERSION}"

      - name: Log notification
        if: steps.check.outputs.is_release == 'true'
        run: |
          echo "Successfully notified googlefonts/fontc-export-plugin repository"
          echo "Version: ${STEPS_VERSION_OUTPUTS_VERSION}"
        env:
          STEPS_VERSION_OUTPUTS_VERSION: ${{ steps.version.outputs.version }}
