# This is heavily inspired on
# https://github.com/PyO3/maturin/blob/main/.github/workflows/release.yml
# Maturin is a tool to build Rust crates as Python packages with minimal configuration,
# which uses cargo under the hood and ensures the binaries are compatible with a wide
# array of platforms and architectures.
# Although fontc and otl-normalizer are pure Rust projects and as such don't use Python,
# making them available on PyPI as binary wheel packages suitable to be installed by pip
# increases their reach among font developers accustomed to Python tools.
#
# The Release workflow uses maturin to build fontc or otl-normalizer for Linux (x86_64 and aarch64),
# Windows (i686 and x86_64) and macOS (universal2 'fat' binary supporting both
# x86_64 and arm64 architectures), package these as Python wheels, and upload to PyPI.
# The same binaries are also uploaded as Github Release assets which can be used
# with `cargo binstall` command.
# The workflow runs automatically when a version tag (i.e. starting with 'fontc-v' or
# 'otl-normalizer-v') gets pushed, or can be manually triggered from Github Actions
# interface (in which case artifacts don't get published, just temporarily uploaded to
# Github Actions).

name: Release

on:
  # only run on version-tagged commits for fontc or otl-normalizer, or manually
  push:
    tags:
      - "fontc-v*.*.*"
      - "otl-normalizer-v*.*.*"
  # enables workflow to be run manually
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_dispatch
  workflow_dispatch:
    inputs:
      tool:
        description: 'Which tool to build'
        required: true
        type: choice
        options:
          - fontc
          - otl-normalizer
        default: fontc

# read-only access to repo contents by default; specific jobs may override it
# https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs
permissions:
  contents: read

jobs:
  detect:
    name: Detect which tool to release
    runs-on: ubuntu-latest
    outputs:
      tool: ${{ steps.detect.outputs.tool }}
      working-directory: ${{ steps.detect.outputs.working-directory }}
      manifest-path: ${{ steps.detect.outputs.manifest-path }}
    steps:
      - name: Detect tool from tag or manual input
        id: detect
        run: |
          # Check if this is a manual workflow_dispatch with an input
          if [[ -n "${{ inputs.tool }}" ]]; then
            TOOL="${{ inputs.tool }}"
          # Otherwise detect from tag
          elif [[ "${GITHUB_REF}" == refs/tags/fontc-v* ]]; then
            TOOL="fontc"
          elif [[ "${GITHUB_REF}" == refs/tags/otl-normalizer-v* ]]; then
            TOOL="otl-normalizer"
          else
            echo "Error: Could not detect tool from tag or manual input"
            echo "Tag was: ${GITHUB_REF}"
            exit 1
          fi

          # Set outputs based on the detected tool
          if [[ "$TOOL" == "fontc" ]]; then
            echo "tool=fontc" >> $GITHUB_OUTPUT
            echo "working-directory=." >> $GITHUB_OUTPUT
            echo "manifest-path=fontc/Cargo.toml" >> $GITHUB_OUTPUT
          elif [[ "$TOOL" == "otl-normalizer" ]]; then
            echo "tool=otl-normalizer" >> $GITHUB_OUTPUT
            echo "working-directory=otl-normalizer" >> $GITHUB_OUTPUT
            echo "manifest-path=otl-normalizer/Cargo.toml" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build ${{ needs.detect.outputs.tool }} ${{ matrix.platform.target }}
    needs: detect
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64-apple-darwin
            os: macos-latest
            python-architecture: x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            python-architecture: x64
          - target: i686-pc-windows-msvc
            os: windows-latest
            python-architecture: x86
    runs-on: ${{ matrix.platform.os }}
    env:
      TOOL: ${{ needs.detect.outputs.tool }}
      # When --sdist is passed, maturin (observed with 1.15) builds the wheel
      # from the extracted sdist in a temp dir; pin cargo's target dir to the
      # workspace so the archive steps below can find the binaries.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          architecture: ${{ matrix.platform.python-architecture }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      # Install gnu-tar because BSD tar is buggy
      # https://github.com/actions/cache/issues/403
      - name: Install GNU tar (macOS)
        if: matrix.platform.os == 'macos-latest'
        run: |
          brew install gnu-tar
          echo "/usr/local/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH

      - name: Build wheel (macOS universal2) and sdist
        if: matrix.platform.target == 'x86_64-apple-darwin'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: universal2-apple-darwin
          args: --release -o dist --sdist
          working-directory: ${{ needs.detect.outputs.working-directory }}

      - name: Build wheel (without sdist)
        if: matrix.platform.target != 'x86_64-apple-darwin'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{matrix.platform.target}}
          args: --release -o dist
          working-directory: ${{ needs.detect.outputs.working-directory }}

      - name: Install wheel
        shell: bash
        working-directory: ${{ needs.detect.outputs.working-directory }}
        run: |
          pip install --no-index --find-links dist/ --force-reinstall ${TOOL}
          which ${TOOL}
          ${TOOL} --version

      - name: Check sdist metadata
        if: matrix.platform.target == 'x86_64-apple-darwin'
        working-directory: ${{ needs.detect.outputs.working-directory }}
        run: pipx run twine check dist/*.tar.gz

      - name: Archive binary
        if: matrix.platform.os != 'windows-latest'
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czvf ../../../${TOOL}-${{ matrix.platform.target }}.tar.gz ${TOOL}
          cd -

      - name: Archive binary (windows)
        if: matrix.platform.os == 'windows-latest'
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          7z a ../../../${TOOL}-${{ matrix.platform.target }}.zip ${TOOL}.exe
          cd -

      - name: Archive binary (macOS aarch64)
        if: matrix.platform.os == 'macos-latest'
        run: |
          cd target/aarch64-apple-darwin/release
          tar czvf ../../../${TOOL}-aarch64-apple-darwin.tar.gz ${TOOL}
          cd -

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ env.TOOL }}-${{ matrix.platform.target }}
          path: ${{ needs.detect.outputs.working-directory }}/dist

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ env.TOOL }}-${{ matrix.platform.target }}
          path: |
            *.tar.gz
            *.zip

  build_linux_glibc:
    name: Build ${{ needs.detect.outputs.tool }} ${{ matrix.platform.target }} (glibc)
    needs: detect
    runs-on: ubuntu-latest
    env:
      TOOL: ${{ needs.detect.outputs.tool }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: "x86_64-unknown-linux-gnu"
            manylinux: "2014"
          - target: "aarch64-unknown-linux-gnu"
            manylinux: "2014"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build Wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release -o dist
          working-directory: ${{ needs.detect.outputs.working-directory }}

      - name: Install x86_64 wheel
        if: startsWith(matrix.platform.target, 'x86_64')
        working-directory: ${{ needs.detect.outputs.working-directory }}
        run: |
          pip install --no-index --find-links dist/ --force-reinstall ${TOOL}
          which ${TOOL}
          ${TOOL} --version

      - name: Archive binary
        run: tar czvf target/release/${TOOL}-${{ matrix.platform.target }}.tar.gz -C target/${{ matrix.platform.target }}/release ${TOOL}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ env.TOOL }}-${{ matrix.platform.target }}
          path: ${{ needs.detect.outputs.working-directory }}/dist

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ env.TOOL }}-${{ matrix.platform.target }}
          path: target/release/${{ env.TOOL }}-${{ matrix.platform.target }}.tar.gz

  build_linux_musl:
    name: Build ${{ needs.detect.outputs.tool }} ${{ matrix.platform.target }} (musl)
    needs: detect
    runs-on: ubuntu-latest
    env:
      TOOL: ${{ needs.detect.outputs.tool }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: "x86_64-unknown-linux-musl"
            image_tag: "x86_64-musl"
            compatibility: "musllinux_1_1"
          - target: "aarch64-unknown-linux-musl"
            image_tag: "aarch64-musl"
            compatibility: "musllinux_1_1"
    container:
      image: docker://ghcr.io/rust-cross/rust-musl-cross:${{ matrix.platform.image_tag }}
    steps:
      # checkout@v3 doesn't work inside the manylinux container:
      # https://github.com/actions/checkout/issues/1487
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build Wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.compatibility }}
          container: off
          args: --release -o dist
          working-directory: ${{ needs.detect.outputs.working-directory }}

      - name: Archive binary
        run: tar czvf target/release/${TOOL}-${{ matrix.platform.target }}.tar.gz -C target/${{ matrix.platform.target }}/release ${TOOL}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ env.TOOL }}-${{ matrix.platform.target }}
          path: ${{ needs.detect.outputs.working-directory }}/dist

      - name: Upload binary artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ env.TOOL }}-${{ matrix.platform.target }}
          path: target/release/${{ env.TOOL }}-${{ matrix.platform.target }}.tar.gz

  release-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/fontc-v') || startsWith(github.ref, 'refs/tags/otl-normalizer-v')
    needs: [detect, build, build_linux_glibc, build_linux_musl]
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      # https://blog.pypi.org/posts/2023-04-20-introducing-trusted-publishers/
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-${{ needs.detect.outputs.tool }}-*
          # so that all artifacts are downloaded in the same directory specified by 'path'
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  release-github:
    permissions:
      # Needed to upload release artifacts.
      contents: write
    name: Publish to GitHub releases
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/fontc-v') || startsWith(github.ref, 'refs/tags/otl-normalizer-v')
    needs: [detect, build, build_linux_glibc, build_linux_musl]
    env:
      TOOL: ${{ needs.detect.outputs.tool }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-${{ needs.detect.outputs.tool }}-*
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-${{ needs.detect.outputs.tool }}-*
          merge-multiple: true
          path: wheels

      # this requirements.txt can be used to pip install the tool more securely
      # https://pip.pypa.io/en/stable/topics/secure-installs/
      - name: Generate requirements.txt with SHA256 hashes
        # Pin pip due to incompatibility of later releases with pip-tools
        # https://github.com/jazzband/pip-tools/issues/2176
        run: |
          pipx install pip-tools
          pipx runpip pip-tools install 'pip==25.0.1'
          echo ${TOOL} | pip-compile - --no-index --find-links wheels/ --no-emit-find-links --generate-hashes --pip-args '--only-binary=:all:' --no-annotate --no-header --output-file requirements.txt

      - name: Compute checksums of release assets
        run: |
          sha256sum *.tar.gz *.zip requirements.txt > checksums.txt

      - name: Detect if tag is a pre-release
        id: before_release
        env:
          # A full release tag is exactly <tool>-v<MAJOR>.<MINOR>.<PATCH>, e.g.
          # fontc-v1.0.0; anything else (fontc-v1.0.0-rc.1, ...) is a pre-release,
          # so an unanticipated tag shape fails safe.
          RELEASE_TAG_PATTERN: "^(fontc|otl-normalizer)-v[[:digit:]]+\\.[[:digit:]]+\\.[[:digit:]]+$"
        run: |
          # strip leading 'refs/tags/' to get the tag name
          TAG_NAME="${GITHUB_REF##*/}"
          if egrep -q "$RELEASE_TAG_PATTERN" <<< "$TAG_NAME"; then
            echo "Tag ${TAG_NAME} is a full release tag"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG_NAME} is not a plain <tool>-vX.Y.Z tag; marking as pre-release"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          # Create descriptive release title with tool name
          # e.g. fontc-v0.3.2 -> fontc 0.3.2, otl-normalizer-v0.0.1 -> otl-normalizer 0.0.1
          if [[ "$TAG_NAME" == fontc-v* ]]; then
            VERSION="${TAG_NAME#fontc-v}"
            echo "release_title=fontc ${VERSION}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == otl-normalizer-v* ]]; then
            VERSION="${TAG_NAME#otl-normalizer-v}"
            echo "release_title=otl-normalizer ${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "release_title=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ steps.before_release.outputs.release_title }}
          files: |
            *.tar.gz
            *.zip
            checksums.txt
            requirements.txt
          prerelease: ${{ steps.before_release.outputs.is_prerelease }}
          generate_release_notes: ${{ needs.detect.outputs.tool == 'fontc' }}
