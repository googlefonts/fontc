# Weekly canary for dependency breakage: update to the newest compatible
# versions of our dependencies and run the checks, so that problems like
# #2042 surface here instead of on unrelated PRs, now that Cargo.lock pins
# the graph everywhere else.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

name: Latest deps

permissions:
  contents: read

env:
  # CI builds start from nothing and are thrown away, so incremental state is
  # only overhead.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  test-latest-deps:
    name: test with latest deps
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'googlefonts/fontc' }}
    env:
      # see rust.yml for why benchmarks are disabled on CI
      FONTC_BENCH_SRCS: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: cargo update
        run: cargo update

      - name: cargo check --all-targets --all-features
        run: cargo check --workspace --all-targets --all-features

      - name: cargo test
        run: cargo test --workspace --all-features
